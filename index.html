<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UPROTA — Refugio de Hábitos en el Yermo</title>
  <meta name="description" content="Tu vida real es tu fortaleza. Sistema de hábitos en un mundo post-colapso.">
  <meta name="theme-color" content="#121110">
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/imagenes/ui/ui_icon_app.png">

  <!-- Estilos Modulares -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/torta.css">
  <link rel="stylesheet" href="css/tablon.css">
  <link rel="stylesheet" href="css/refugio.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body>
  <div class="app-container">
    <!-- CABECERA PRINCIPAL -->
    <header class="app-header">
      <div class="header-top">
        <div class="refugio-id">
          <span class="refugio-avatar">🏕️</span>
          <div class="refugio-textos">
            <h1 id="header-prota-nombre">Prota</h1>
            <span id="header-refugio-nivel">Nivel 0 &bull; Punto Cero</span>
          </div>
        </div>
        <button id="btn-ir-hogar-top" class="btn-hogar-link hidden">
          <span>🕯️</span>
          <span>El Hogar</span>
        </button>
      </div>

      <!-- BARRA DE RECURSOS DEL ASENTAMIENTO -->
      <div class="recursos-strip">
        <div class="recurso-chip" title="Tablas de madera">
          <span>🪵</span>
          <span id="res-tablas">0</span>
        </div>
        <div class="recurso-chip" title="Clavos y chatarra">
          <span>🔩</span>
          <span id="res-clavos">0</span>
        </div>
        <div class="recurso-chip" title="Provisiones de comida">
          <span>🥕</span>
          <span id="res-provisiones">0</span>
        </div>
        <div class="recurso-chip" title="Agua pura">
          <span>💧</span>
          <span id="res-agua">0L</span>
        </div>
        <div id="chip-recurso-bateria" class="recurso-chip hidden" title="Carga de Bioenergía">
          <span>⚡</span>
          <span id="res-bateria">0%</span>
        </div>
      </div>
    </header>

    <!-- CONTENEDOR DE VISTAS PRINCIPALES -->
    <main class="app-main-content">
      <!-- VISTA 1: TABLÓN (Torta 21d, Sendas, Cadenas, Faros) -->
      <section id="vista-tablon" class="vista-panel active"></section>

      <!-- VISTA 2: REFUGIO (Almacén, 10 Niveles, Bolsa Real, Bioenergía) -->
      <section id="vista-refugio" class="vista-panel"></section>

      <!-- VISTA 3: MISIONES (1 misión/día, Exploración y Recolección) -->
      <section id="vista-misiones" class="vista-panel"></section>

      <!-- VISTA 4: COMUNICACIÓN (Fase 0 Don Chui, Fase 1 Radio, Fase 2 WAN) -->
      <section id="vista-comunicacion" class="vista-panel"></section>

      <!-- VISTA 5: EL HOGAR (Validación radical, Evidencia, Luz, Sabiduría estoica) -->
      <section id="vista-hogar" class="vista-panel"></section>
    </main>

    <!-- NAVEGACIÓN INFERIOR (3 TABS BASE + 2 DESBLOQUEABLES) -->
    <nav class="app-bottom-nav">
      <button class="nav-tab-btn active" data-tab="tablon">
        <span class="tab-icon">📋</span>
        <span class="tab-label">Tablón</span>
      </button>
      <button class="nav-tab-btn" data-tab="refugio">
        <span class="tab-icon">🛖</span>
        <span class="tab-label">Refugio</span>
      </button>
      <button class="nav-tab-btn" data-tab="misiones">
        <span class="tab-icon">🧭</span>
        <span class="tab-label">Misiones</span>
      </button>
      <button id="nav-btn-radio" class="nav-tab-btn hidden" data-tab="comunicacion">
        <span class="tab-icon">📻</span>
        <span class="tab-label">Radio</span>
      </button>
      <button id="nav-btn-hogar" class="nav-tab-btn hidden" data-tab="hogar">
        <span class="tab-icon">🕯️</span>
        <span class="tab-label">El Hogar</span>
      </button>
    </nav>

    <!-- CONTENEDOR GLOBAL DE MODALES (Sabiduría Diaria, Creación, etc.) -->
    <div id="modal-container" class="modal-overlay hidden">
      <div id="modal-content" class="modal-card"></div>
    </div>
  </div>

  <!-- Entrada JavaScript ES Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
