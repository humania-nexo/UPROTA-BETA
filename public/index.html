<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPROTA - Sala de Chat Local</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121110; color: #f5f2eb; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .chat-app { width: 100%; max-width: 900px; height: 100vh; display: flex; flex-direction: column; background: #1a1816; border-left: 2px solid #38342f; border-right: 2px solid #38342f; }
    
    .chat-header { padding: 14px 20px; background: #24211e; border-bottom: 2px solid #38342f; display: flex; justify-content: space-between; align-items: center; }
    .chat-title { font-size: 1.1rem; color: #f59e0b; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .chat-status { font-size: 0.8rem; font-weight: 600; color: #4ade80; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; }

    .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: #141312; }
    
    .msg-card { display: flex; flex-direction: column; max-width: 85%; padding: 12px 16px; border-radius: 8px; font-size: 0.94rem; line-height: 1.5; word-wrap: break-word; }
    .msg-author { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 12px; }
    .msg-text { white-space: pre-wrap; font-size: 0.92rem; }
    .msg-time { font-size: 0.7rem; opacity: 0.6; }

    .role-director { align-self: flex-end; background: #b45309; color: #ffffff; border: 1px solid #d97706; }
    .role-director .msg-author { color: #fef0a8; }

    .role-nexo { align-self: flex-start; background: #1e293b; border-left: 4px solid #38bdf8; color: #f8fafc; }
    .role-nexo .msg-author { color: #38bdf8; }

    .role-pix { align-self: flex-start; background: #3b1d1d; border-left: 4px solid #f87171; color: #fef2f2; }
    .role-pix .msg-author { color: #f87171; }

    .role-silas { align-self: flex-start; background: #2e1065; border-left: 4px solid #c084fc; color: #faf5ff; }
    .role-silas .msg-author { color: #c084fc; }

    .chat-footer { padding: 14px 18px; background: #24211e; border-top: 2px solid #38342f; display: flex; gap: 10px; align-items: center; }
    .select-role { padding: 12px 14px; background: #121110; border: 1px solid #4f4a43; border-radius: 6px; color: #f59e0b; font-weight: 700; font-size: 0.9rem; cursor: pointer; outline: none; }
    .input-msg { flex: 1; padding: 12px 16px; background: #121110; border: 1px solid #4f4a43; border-radius: 6px; color: #ffffff; font-size: 0.95rem; outline: none; }
    .btn-send { padding: 12px 24px; background: #d97706; border: none; border-radius: 6px; color: #ffffff; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="chat-header">
      <div class="chat-title">
        <span>’쏉️ UPROTA DEV TEAM</span>
        <span style="font-size: 0.8rem; color: #a8a29e; font-weight: normal;">— Sala de Operaciones Local</span>
      </div>
      <div class="chat-status" id="connStatus">
        <span class="status-dot"></span>
        <span>En Línea (localhost:4000)</span>
      </div>
    </div>

    <div class="chat-body" id="chatBox"></div>

    <form class="chat-footer" id="chatForm">
      <select class="select-role" id="roleSelect">
        <option value="Director">👹 Dario / Director</option>
        <option value="Nexo">🤭 Nexo (Código)</option>
        <option value="Pix">🎨 Pix (Arte)</option>
        <option value="Silas">📜 Silas (Lore)</option>
      </select>
      <input type="text" class="input-msg" id="msgInput" placeholder="Escribe un mensaje para el equipo..." autocomplete="off" required autofocus>
      <button type="submit" class="btn-send" id="sendBtn">Enviar</button>
    </form>
  </div>

  <script>
    (function() {
      let lastMessageId = 0;
      const chatBox = document.getElementById('chatBox');
      const chatForm = document.getElementById('chatForm');
      const msgInput = document.getElementById('msgInput');
      const roleSelect = document.getElementById('roleSelect');
      const connStatus = document.getElementById('connStatus');

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }

      function getRoleClass(author) {
        const a = (author || '').toLowerCase();
        if (a.includes('director') || a.includes('dario')) return 'role-director';
        if (a.includes('nexo')) return 'role-nexo';
        if (a.includes('pix')) return 'role-pix';
        if (a.includes('silas')) return 'role-silas';
        return 'role-director';
      }

      async function fetchMessages() {
        try {
          const response = await fetch('/api/mensajes?desde=' + lastMessageId);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const messages = await response.json();
          
          if (Array.isArray(messages) && messages.length > 0) {
            messages.forEach(m => {
              const card = document.createElement('div');
              card.className = 'msg-card ' + getRoleClass(m.autor);
              card.innerHTML = 
                '<div class="msg-author">' +
                  '<span>' + escapeHTML(m.autor) + '</span>' +
                  '<span class="msg-time">' + escapeHTML(m.hora || '') + '</span>' +
                '</div>' +
                '<div class="msg-text">' + escapeHTML(m.texto) + '</div>';
              
              chatBox.appendChild(card);
              lastMessageId = Math.max(lastMessageId, m.id || 0);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
          }
          connStatus.innerHTML = '<span class="status-dot"></span><span>En Línea (localhost:4000)</span>';
          connStatus.style.color = '#4ade80';
        } catch (err) {
          connStatus.innerHTML = '<span class="status-dot" style="background:#ef4444;"></span><span>Reconectando...</span>';
          connStatus.style.color = '#ef4444';
        }
      }

      chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const text = msgInput.value.trim();
        const author = roleSelect.value;
        if (!text) return;
        msgInput.value = '';
        msgInput.focus();

        try {
          const res = await fetch('/api/mensajes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ autor: author, texto: text })
          });
          if (res.ok) await fetchMessages();
        } catch (err) {
          console.error('Error al enviar:', err);
        }
      });

      fetchMessages();
      setInterval(fetchMessages, 800);
    })();
  </script>
</body>
</html>
